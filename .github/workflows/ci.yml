name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", stable]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...

  # Runs the SocketCAN code against the Linux kernel's CAN stack (vcan), and
  # checks the ISO-TP implementation against an independent one.
  socketcan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y can-utils "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          # The kernel's own ISO-TP is optional: the Azure kernels of the
          # hosted runners do not ship it, and its cross-check is skipped.
          sudo modprobe can-isotp || echo "::notice::can-isotp is not available on $(uname -r)"
      - name: Install python-can and can-isotp for the cross-check
        run: pip install -r socketcan/testdata/requirements.txt
      - run: go test -race -tags vcan -v ./socketcan/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
